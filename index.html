<!DOCTYPE html>
<html lang="bn" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>PoriChoy — পরিচয়</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7f0;--card:#fff;--ink:#241a2e;--mut:#8a7f94;--line:#f0e4da;--a:#ff5e3a;--b:#7c3aed;--c:#06b6d4;--grad:linear-gradient(135deg,#ff5e3a,#ff2d87 55%,#7c3aed);--nav:rgba(255,255,255,.9);--sos:#e11d48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140f1c;--card:#1f1829;--ink:#f6effa;--mut:#9d90ab;--line:#2d2439;--nav:rgba(31,24,41,.9)}}
:root[data-theme="dark"]{--bg:#140f1c;--card:#1f1829;--ink:#f6effa;--mut:#9d90ab;--line:#2d2439;--nav:rgba(31,24,41,.9)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,select{-webkit-user-select:text;user-select:text;touch-action:auto}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans','Noto Sans Bengali',system-ui,sans-serif;max-width:560px;margin:0 auto;position:relative}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);backdrop-filter:blur(14px);z-index:21}
.logo{display:flex;align-items:center;gap:9px;flex:1}
.mark{width:38px;height:38px;border-radius:13px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;transform:rotate(-6deg);box-shadow:0 6px 16px #ff2d8744}
.logo b{font-size:19px;letter-spacing:-.4px;display:block;line-height:1}
.logo small{font-size:10.5px;color:var(--mut)}

.ib{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;transition:.15s}
.ib:active{transform:scale(.92)}
.pill{display:inline-flex;gap:6px;align-items:center;margin:10px 16px 0;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px #22c55e33}
.dot.offline{background:#ef4444;box-shadow:0 0 0 4px #ef444433}
.view{display:none;padding:12px 16px 130px}.view.on{display:block}
.stories{display:flex;gap:14px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;-ms-overflow-style:none}
.stories::-webkit-scrollbar{display:none}

.st{flex:none;width:64px;text-align:center;font-size:10.5px;color:var(--mut);font-weight:700}
.ring{width:62px;height:62px;border-radius:50%;padding:3px;background:var(--grad);margin-bottom:5px;transition:.2s}
.st.on .ring{background:var(--ink);transform:scale(1.05)}
.ring i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--card);font-style:normal;font-size:23px;border:2px solid var(--card)}
.search{width:100%;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;outline:none;margin:10px 0;transition:.2s}
.search:focus{border-color:var(--a);box-shadow:0 0 0 3px #ff5e3a22}
.post{background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px;border:1px solid var(--line);box-shadow:0 8px 24px #7c3aed0a}

.ph{display:flex;align-items:center;gap:11px}
.av{width:44px;height:44px;border-radius:16px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.ph h4{font-size:14px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}.ph span{font-size:11px;color:var(--mut)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:#7c3aed1a;color:var(--b);font-weight:700;font-size:10.5px;margin-left:4px}
.post p{margin:8px 0;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.badge-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:12.5px;display:grid;gap:4px}
.badge-box b{color:var(--a)}

.act{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--mut);font-weight:700;align-items:center;flex-wrap:wrap}
.act button{padding:7px 12px;border-radius:99px;background:var(--bg);transition:.15s}
.act button:active{transform:scale(.95)}
.act .lk.on{background:#ff2d8720;color:#ff2d87}
.cm{display:none;margin-top:10px}.cm.on{display:block}
.cm div.c{background:var(--bg);padding:8px 12px;border-radius:14px;margin-bottom:6px;font-size:12.5px;word-break:break-word}
.cm form{display:flex;gap:6px;margin-top:6px}
.cm input{flex:1;padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px;outline:none}
.cm form button,.go{background:var(--grad);color:#fff;padding:11px 16px;border-radius:99px;font-weight:800;font-size:13px;box-shadow:0 6px 18px #ff2d8733;transition:.15s}
.go:active{transform:scale(.98)}

h2.t{font-size:20px;letter-spacing:-.4px;margin:8px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;text-align:left;transition:.15s}
.cat:active{transform:scale(.97)}
.cat i{font-style:normal;font-size:28px;display:block;margin-bottom:8px}
.cat b{font-size:13.5px;display:block}.cat small{font-size:11px;color:var(--mut);line-height:1.4;display:block;margin-top:3px}
.sosh{background:linear-gradient(135deg,#e11d48,#f97316);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px}
.sosh p{font-size:12.5px;opacity:.9;margin-top:4px}
.sos{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.sos .e{width:46px;height:46px;border-radius:16px;background:#e11d4818;display:grid;place-items:center;font-size:22px}

.sos div{flex:1}.sos b{font-size:13.5px}.sos small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sos a{background:var(--sos);color:#fff;text-decoration:none;padding:10px 14px;border-radius:99px;font-weight:800;font-size:12px}
.stat{border-radius:24px;padding:20px;color:#fff;margin-bottom:10px}
.stat b{font-size:32px;display:block;letter-spacing:-1px}.stat span{font-size:12px;opacity:.9;font-weight:700}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:536px;z-index:30;display:flex;align-items:center;justify-content:space-around;background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:28px;padding:8px;box-shadow:0 12px 36px #1d0f3a22}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--mut);padding:6px 10px;min-width:56px}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--a)}

nav .fab{width:56px;height:56px;min-width:56px;border-radius:50%;background:var(--grad);color:#fff;margin-top:-30px;font-size:28px;font-weight:300;box-shadow:0 10px 24px #ff2d8766;justify-content:center;padding:0}
.sheet{position:fixed;inset:0;background:#0008;z-index:40;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.sheet.on{display:flex}
.sheet form{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:92vh;overflow:auto}
.sheet h3{font-size:17px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13.5px;outline:none}
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:12.5px;font-weight:700;z-index:120;transition:.3s;pointer-events:none;box-shadow:0 10px 25px #0004;text-align:center;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}

.empty{text-align:center;color:var(--mut);padding:50px 16px;font-size:13px;line-height:1.6}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;margin:10px 0}
.seg button{flex:1;padding:9px 4px;border-radius:99px;font-size:12.5px;font-weight:800;color:var(--mut);transition:.2s}
.seg button.on{background:var(--grad);color:#fff}
.media{width:100%;max-height:420px;border-radius:18px;margin:2px 0 12px;background:#000;object-fit:cover;display:block}
.lnk{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:12px;color:var(--b);font-weight:700;text-decoration:none;margin-bottom:12px;word-break:break-all}
.rx{position:relative}
.pop{display:none;position:absolute;bottom:42px;left:0;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 8px;gap:2px;box-shadow:0 10px 30px #0003;z-index:5}
.pop.on{display:flex}.pop button{font-size:22px;padding:2px 5px;background:none!important;transition:.15s}.pop button:active{transform:scale(1.4)}

.stars{display:flex;align-items:center;gap:1px;margin:10px 0 2px;font-size:12px;color:var(--mut)}
.stars button{font-size:20px;color:#d6cdde;padding:0 1px}.stars button.on{color:#f59e0b}
.fol{font-size:11px;font-weight:800;color:var(--b);padding:3px 9px;border-radius:99px;background:#7c3aed1a;margin-left:4px}
.fol.on{color:var(--mut);background:var(--bg)}
.sum{font-size:11.5px;color:var(--mut);margin:6px 0 8px;font-weight:700}
.prog-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:6px;display:none}
.prog-bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.prog-bar i{display:block;height:100%;width:0;background:var(--grad);transition:.2s}
.prog-txt{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--mut)}

.warn{background:#f59e0b22;border:1px solid #f59e0b55;border-radius:18px;padding:12px 14px;font-size:12.5px;margin:10px 0;line-height:1.5}
.warn button{color:var(--a);font-weight:800;margin-top:4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.file{padding:14px;border:2px dashed var(--line);border-radius:16px;text-align:center;font-size:13px;color:var(--mut);font-weight:700;cursor:pointer;display:block}
.del{margin-left:auto;color:var(--mut);font-size:15px;padding:4px 8px}
.me{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;text-align:center;margin-bottom:12px}
.me .av{width:76px;height:76px;border-radius:26px;font-size:32px;margin:0 auto 10px}
.me small{color:var(--mut);font-size:11px}
.me input{margin-top:10px;text-align:center}
.sk{height:150px;border-radius:24px;margin-bottom:14px;background:linear-gradient(90deg,var(--card) 25%,var(--line) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.lb{position:fixed;inset:0;background:#000e;z-index:70;display:none;align-items:center;justify-content:center;padding:16px}.lb.on{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:12px}
img.media{cursor:zoom-in}.c .dc{float:right;color:var(--mut);font-size:11px;padding:0 4px}

.auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.auth-box{background:var(--card);border:1px solid var(--line);border-radius:32px;padding:24px 20px;width:100%;max-width:420px;box-shadow:0 20px 50px #7c3aed22;text-align:center;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(15px)}}
.auth-box h2{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.auth-box>p{font-size:13px;color:var(--mut);margin:4px 0 16px}
.ig{position:relative;margin-bottom:12px}
.auth-box input{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;outline:none;text-align:center}
.auth-box input:focus{border-color:var(--a)}
.rand-btn{width:100%;padding:11px 14px;border-radius:99px;border:1px dashed var(--b);background:#7c3aed12;color:var(--b);font-size:12.5px;font-weight:800;margin-top:8px;transition:.15s}
.rand-btn:active{transform:scale(.98)}
.ai{font-size:11.5px;color:var(--mut);margin-top:14px;line-height:1.5}
.go:disabled{opacity:.6;pointer-events:none}
#saveName,#logoutBtn{width:100%;margin-top:8px}
#logoutBtn{background:#ef4444;color:#fff;padding:12px 16px;border-radius:99px;font-weight:800;font-size:13.5px}

.c-modal{position:fixed;inset:0;background:#0008;z-index:110;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.c-modal.on{display:flex}
.c-box{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 40px #0004;animation:fi .2s ease}
.c-box p{font-size:14.5px;font-weight:700;margin-bottom:18px;line-height:1.5}
.c-acts{display:flex;gap:10px}
.c-acts button{flex:1;padding:11px;border-radius:99px;font-weight:800;font-size:13px}
.c-no{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.c-yes{background:var(--grad);color:#fff}
.quick-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink);margin:3px;cursor:pointer;transition:.15s}
.quick-chip:active{transform:scale(.95)}
</style>
</head>
<body oncontextmenu="return false">

<div class="auth-overlay" id="authScreen" style="display:none">
  <div class="auth-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <span style="font-size:11px;color:var(--mut);font-weight:700">🔒 সুরক্ষিত প্রবেশ</span>
      <button type="button" class="ib" id="authLang" style="width:32px;height:32px;font-size:11px">EN</button>
    </div>
    <div class="mark" style="margin:0 auto 10px;width:54px;height:54px;font-size:26px;transform:none">প</div>
    <h2 data-t="authT"></h2>
    <p data-t="authS"></p>
    <form id="authForm" onsubmit="return false" autocomplete="off">
      <div class="ig">
        <input id="loginId" type="text" data-ph="uPh" maxlength="30" autocomplete="off" spellcheck="false" required>
      </div>
      <div class="ig">
        <input id="loginPin" type="password" data-ph="pinPh" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required>
      </div>
      <button class="go" id="loginBtn" type="submit" style="width:100%"></button>
      <button class="rand-btn" id="randBtn" type="button" data-t="randGen"></button>
    </form>
    <div id="savedBox" style="display:none;margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)">
      <div style="font-size:11px;color:var(--mut);margin-bottom:6px;font-weight:700" data-t="savedAcc"></div>
      <div id="savedList"></div>
    </div>
    <div class="ai" data-t="authI"></div>
  </div>
</div>

<header>
  <div class="logo">
    <div class="mark">প</div>
    <div><b id="bt">PoriChoy</b><small data-t="sub"></small></div>
  </div>
  <button class="ib" id="lang" type="button">BN</button>
  <button class="ib" id="theme" type="button">◐</button>
</header>
<div class="pill"><span class="dot" id="netDot"></span><span id="locT"></span></div>

<section class="view on" id="v-home">
  <div id="warn"></div>
  <div class="seg" id="seg">
    <button type="button" data-s="local" class="on" data-t="local"></button>
    <button type="button" data-s="national" data-t="national"></button>
    <button type="button" data-s="friends" data-t="friends"></button>
  </div>
  <div class="stories" id="stories" style="margin:0 -16px"></div>
  <input class="search" id="q" data-ph="search">
  <div id="feed"></div>
</section>

<section class="view" id="v-dir">
  <h2 class="t" data-t="dir"></h2>
  <div class="grid" id="cats"></div>
</section>

<section class="view" id="v-sos">
  <div class="sosh">
    <b style="font-size:18px" data-t="sosT"></b>
    <p data-t="sosD"></p>
  </div>
  <div style="margin-bottom:12px">
    <button type="button" class="go" id="addSosBtn" style="width:100%;font-size:13px">➕ জরুরি নম্বর যুক্ত করুন (Add Emergency Number)</button>
  </div>
  <div id="sosList"></div>
</section>

<section class="view" id="v-me">
  <div class="me">
    <div class="av" id="meAv">?</div>
    <b id="meName"></b><br>
    <small id="meId"></small>
    <input class="search" id="nameIn" data-ph="name" maxlength="30">
    <input class="search" id="areaIn" data-ph="areaPh" maxlength="40" style="margin-top:6px">
    <button class="go" id="saveName" type="button" data-t="save"></button>
    <button id="logoutBtn" type="button" data-t="logout"></button>
  </div>
  <div class="stat" style="background:linear-gradient(135deg,#10b981,#06b6d4)"><b id="s1">0</b><span data-t="s1"></span></div>
  <div class="stat" style="background:linear-gradient(135deg,#ff5e3a,#ff2d87)"><b id="s2">0</b><span data-t="s2"></span></div>
  <div class="stat" style="background:linear-gradient(135deg,#7c3aed,#4f46e5)"><b id="s3">0</b><span data-t="s3"></span></div>
  <div class="stat" style="background:linear-gradient(135deg,#f59e0b,#ef4444)"><b id="s4">0</b><span data-t="s4"></span></div>
  <h2 class="t" data-t="mine" style="margin-top:18px"></h2>
  <div id="myPosts"></div>
</section>

<nav>
  <button type="button" data-go="home" class="on"><i>🏡</i><span data-t="nHome"></span></button>
  <button type="button" data-go="dir"><i>🧭</i><span data-t="nDir"></span></button>
  <button type="button" class="fab" id="fab">+</button>
  <button type="button" data-go="sos"><i>🚨</i><span>SOS</span></button>
  <button type="button" data-go="me"><i>👤</i><span data-t="nMe"></span></button>
</nav>

<div class="sheet" id="sheet">
  <form id="pf">
    <h3 data-t="newP"></h3>
    <div class="row">
      <select id="pc"></select>
      <select id="ps">
        <option value="local" data-t="local"></option>
        <option value="national" data-t="national"></option>
      </select>
    </div>
    
    <div id="busFields" style="display:none;gap:8px;grid-template-columns:1fr">
      <input id="bName" type="text" data-ph="bNamePh" maxlength="50">
      <input id="bPhone" type="tel" data-ph="phone" maxlength="20">
    </div>

    <div id="vehFields" style="display:none;gap:8px;grid-template-columns:1fr">
      <input id="vName" type="text" data-ph="vNamePh" maxlength="50">
      <input id="vNum" type="text" data-ph="vNumPh" maxlength="30">
      <input id="vPhone" type="tel" data-ph="phone" maxlength="20">
    </div>

    <textarea id="pt" rows="3" data-ph="what" maxlength="2000"></textarea>
    <input id="pl" type="url" data-ph="link" maxlength="500">
    <input id="pp" type="tel" data-ph="phone" maxlength="20">
    <input id="pLoc" type="text" data-ph="locationPh" maxlength="60">
    <label class="file"><span id="flT" data-t="pick"></span><input id="pm" type="file" accept="image/*" hidden></label>
    
    <div class="prog-box" id="progBox">
      <div class="prog-txt"><span id="progTitle" data-t="uploading"></span><span id="progPct">0%</span></div>
      <div class="prog-bar"><i id="progBar"></i></div>

  const h=Math.floor(m/60);

};

function copyText(str){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).then(()=>toast(t('copied'))).catch(()=>fallbackCopy(str));
  }else fallbackCopy(str);
}
function fallbackCopy(str){
  const ta=document.createElement('textarea');
  ta.value=str;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast(t('copied'))}catch(_){}
  ta.remove();
}

function visible(){
  const q=$('#q').value.toLowerCase().trim();
  const now = Date.now();
  const maxAge = 4 * 24 * 60 * 60 * 1000;

  return Object.keys(posts).reverse().filter(k=>{
    const p=posts[k];
    if(!p||typeof p!=='object')return false;

    if(p.ts && (now - p.ts > maxAge)){
      remove(ref(db,'posts/'+k));
      return false;
    }

    const repCnt=Object.keys(p.reports||{}).length;
    if(repCnt>=4){
      remove(ref(db,'posts/'+k));
      return false;
    }
    if(scope==='local'){if(!isNear(p))return false}
    else if(scope==='national'){if(p.scope!=='national')return false}
    else if(!follow[p.uid])return false;
    if(filter!=='all'&&p.category!==filter)return false;
    
    return!q||(p.text||'').toLowerCase().includes(q)||nameOf(p.uid).toLowerCase().includes(q)||(p.location||'').toLowerCase().includes(q)||(p.bName||'').toLowerCase().includes(q)||(p.vName||'').toLowerCase().includes(q)||(p.vNum||'').toLowerCase().includes(q);
  }).map(k=>[k,posts[k]]);
}

let viewedPosts = new Set();
try { viewedPosts = new Set(JSON.parse(sessionStorage.getItem('pc_views') || '[]')); } catch(e){}

const viewObserver = new IntersectionObserver((entries, observer) => {
  entries.forEach(entry => {
    if(entry.isIntersecting) {
      const k = entry.target.dataset.pid;
      if(k && !viewedPosts.has(k)) {
        viewedPosts.add(k);
        sessionStorage.setItem('pc_views', JSON.stringify([...viewedPosts]));
        update(ref(db, `posts/${k}`), { views: increment(1) }).catch(()=>{});
      }
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.5 });

function locate(){
  locErr=null;render();
  if(!navigator.geolocation){locErr=1;render();return}
  navigator.geolocation.watchPosition(p=>{
    const n={lat:p.coords.latitude,lng:p.coords.longitude};
    if(!loc||dist(loc.lat,loc.lng,n.lat,n.lng)>.1){loc=n;locErr=null;render()}
  },()=>{if(!loc){locErr=1;render()}},{enableHighAccuracy:true,maximumAge:60000,timeout:20000});
}

async function uploadMedia(file){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        const max=1000;
        if(w>max||h>max){
          if(w>h){h=Math.round(h*(max/w));w=max;}
          else{w=Math.round(w*(max/h));h=max;}
        }
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        res(canvas.toDataURL('image/jpeg',.78));
      };
      img.onerror=rej;
      img.src=e.target.result;
    };
    reader.onerror=rej;
    reader.readAsDataURL(file);
  });
}

async function doAuth(){
  const raw=$('#loginId').value.trim().slice(0,30);
  const pin=$('#loginPin').value.trim();
  if(raw.length<2)return toast(t('badName'));
  if(pin.length!==4||!/^\d{4}$/.test(pin))return toast(t('badPin'));

  const b=$('#loginBtn');b.disabled=true;
  try{
    let authUser=auth.currentUser;
    if(!authUser){
      const cred=await signInAnonymously(auth);
      authUser=cred.user;
    }
    const currentAuthUid=authUser.uid;

    let targetUid=null;
    try{
      const snap=await get(ref(db,'users'));
      const allUsrs=snap.val()||{};
      for(const [k,u] of Object.entries(allUsrs)){
        if(u&&u.name&&u.name.toLowerCase()===raw.toLowerCase()){
          if(u.pin&&u.pin!==pin){
            b.disabled=false;
            return toast(t('wrongPin'));
          }
          targetUid=k;
          break;
        }
      }
    }catch(_){}

    uid=targetUid||currentAuthUid;
    myName=raw;
    rememberAccount(raw,pin);

    try{
      const uSnap=await get(ref(db,`users/${uid}`));
      const uDat=uSnap.val()||{};
      if(uDat.area)myArea=uDat.area;
      if(Array.isArray(uDat.customSos))mySos=uDat.customSos;
    }catch(_){}

    await update(ref(db,`users/${uid}`),{
      name:myName.slice(0,30),
      pin:pin,
      area:(myArea||'').slice(0,40)
    });

    pref.set('pc_last_account',JSON.stringify({name:raw,pin}));
    $('#authScreen').style.display='none';
    startSession(uid);
  }catch(err){
    console.error('Login error:',err);
    toast(t('fail'));
  }
  b.disabled=false;
}

function stopSession(){
  unsubs.forEach(fn=>{try{fn()}catch(_){}});
  unsubs=[];
}

function startSession(currentUid){
  stopSession();
  unsubs.onValue=null;
  unsubs.push(onValue(query(ref(db,'posts'),limitToLast(300)),s=>{
    posts=s.val()||{};loaded=true;render();
  }));
  unsubs.push(onValue(ref(db,'users'),s=>{
    const v=s.val()||{};users={};
    Object.keys(v).forEach(k=>{if(v[k])users[k]={name:v[k].name,area:v[k].area}});
    render();
  }));
  unsubs.push(onValue(ref(db,'online'),s=>{
    online=Object.keys(s.val()||{}).length;render();
  }));
  unsubs.push(onValue(ref(db,'publicSos'),s=>{
    publicSos=s.val()||{};render();
  }));
  unsubs.push(onValue(ref(db,`users/${currentUid}`),s=>{
    const v=s.val()||{};
    if(v.name)myName=v.name;
    if(v.area!=null)myArea=v.area;
    follow=v.following||{};
    if(Array.isArray(v.customSos))mySos=v.customSos;
    else mySos=[];
    render();
  }));
  const pr=ref(db,'online/'+currentUid);
  set(pr,true);
  onDisconnect(pr).remove();
}

async function boot(){
  render();
  locate();
  let lastAcc=null;
  try{lastAcc=JSON.parse(pref.get('pc_last_account','null'))}catch(_){}
  
  if(lastAcc&&lastAcc.name&&lastAcc.pin){
    $('#loginId').value=lastAcc.name;
    $('#loginPin').value=lastAcc.pin;
    doAuth();
  }else{
    $('#authScreen').style.display='flex';
  }
}

boot();
</script>
</body>
</html>
